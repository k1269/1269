<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kingdom 1269 Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة تحويل الجداول إلى Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">

    <main class="max-w-4xl mx-auto">
        <!-- قسم تسجيل دخول الأعضاء -->
        <div id="login-section" class="bg-gray-800 p-8 rounded-xl border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-amber-400">Alliance Portal Login</h2>
            <!-- ... (نموذج الدخول بالنيكنيم كما في الرد السابق) ... -->
        </div>

        <!-- زر دخول الأدمن المخفي (يظهر عند الضغط على أيقونة صغيرة في الفوتر) -->
        <div class="mt-10 text-center">
            <button onclick="adminLogin()" class="text-xs text-gray-600 hover:text-gray-400">Admin Access</button>
        </div>

        <!-- لوحة تحكم الأدمن (تظهر فقط بعد دخول الجيميل) -->
        <section id="admin-dashboard" class="hidden bg-gray-800 p-8 rounded-xl border border-amber-600 mt-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-amber-400">Admin Command Center</h2>
                <button onclick="exportToExcel()" class="bg-emerald-600 px-4 py-2 rounded text-sm font-bold hover:bg-emerald-700">Export to Excel</button>
            </div>
            <div class="overflow-x-auto">
                <table id="data-table" class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-700">
                            <th class="p-2">Nickname</th>
                            <th class="p-2">Alliance</th>
                            <th class="p-2">Const Speedups</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config
        const app = initializeApp({ /* ... */ });
        const auth = getAuth(app);
        const db = getFirestore(app);

        // وظيفة الأدمن (الجيميل)
        window.adminLogin = async () => {
            const provider = new GoogleAuthProvider();
            const result = await signInWithPopup(auth, provider);
            if (result.user.email === "kdn1269@gmail.com") {
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadTableData();
            } else {
                alert("Unauthorized!");
            }
        };

        // وظيفة التصدير لملف إكسل
        window.exportToExcel = () => {
            const table = document.getElementById("data-table");
            const wb = XLSX.utils.table_to_book(table, { sheet: "Sheet1" });
            XLSX.writeFile(wb, "Kingdom1269_Report.xlsx");
        };

        async function loadTableData() {
            const querySnapshot = await getDocs(collection(db, "appointment_requests"));
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                tbody.innerHTML += `<tr>
                    <td class="p-2">${data.inGameName}</td>
                    <td class="p-2">${data.alliance}</td>
                    <td class="p-2">${data.constSpeedups}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
