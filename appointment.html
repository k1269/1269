<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom 1269 - Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #2a2a2a; color: #fff; }
        button { background: #ff4757; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
        .admin-btn { background: #4158D0; background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kingdom 1269</h2>
        <p>Welcome Chief! Enter your game nickname to join.</p>
        
        <!-- تسجيل دخول الأعضاء بالنيك‌نيم -->
        <input type="text" id="nicknameInput" placeholder="Enter your In-game Nickname">
        <button id="memberLoginBtn">Login as Member</button>

        <hr style="margin: 20px 0; border: 0.5px solid #333;">

        <!-- تسجيل دخول الآدمن بـ Gmail -->
        <button id="adminLoginBtn" class="admin-btn">Admin Login (Google)</button>
    </div>

    <!-- سكربت الـ Firebase والمنطق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

        // ضع إعدادات مشروعك هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();
        const provider = new GoogleAuthProvider();

        // 1. منطق دخول الأعضاء العاديين (بالنيك‌نيم)
        document.getElementById("memberLoginBtn").addEventListener("click", () => {
            const nickname = document.getElementById("nicknameInput").value.trim();
            if (nickname === "") {
                alert("Please enter your in-game nickname!");
                return;
            }
            // حفظ النيك‌نيم في التخزين المحلي والانتقال للرئيسية
            localStorage.setItem("playerNickname", nickname);
            window.location.href = "command-center.html";
        });

        // 2. منطق دخول الآدمن (بواسطة Gmail والتحقق من الفايربيس)
        document.getElementById("adminLoginBtn").addEventListener("click", async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const email = user.email;

                // التحقق مما إذا كان الإيميل موجوداً في مجموعة admins في Firestore
                const adminDocRef = doc(db, "admins", email);
                const adminSnap = await getDoc(adminDocRef);

                if (adminSnap.exists()) {
                    // مسجل كآدمن بنجاح
                    localStorage.setItem("adminEmail", email);
                    window.location.href = "command-center.html";
                } else {
                    alert("Access Denied: This Google account is not registered as an admin.");
                    auth.signOut();
                }
            } catch (error) {
                console.error("Login Error:", error.message);
                alert("Login failed: " + error.message);
            }
        });
    </script>
</body>
</html>
