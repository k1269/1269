<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom 1269 Appointment Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 50%, #f3e5ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="w-full bg-[#070a12] border-b border-amber-900/30 py-6">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="https://github.com/k1269/1269/blob/main/IMG_3934.png?raw=true" alt="Logo" class="w-12 h-12 object-contain">
                <span class="text-xl font-bold gold-gradient">Kingdom 1269</span>
            </div>
            <a href="https://k1269.github.io/1269/" class="bg-black/50 hover:bg-amber-600/80 text-white px-4 py-2 rounded-full text-xs font-bold transition border border-amber-500/50">
                Main Site 🌐
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold gold-gradient">KVK Appointment Desk</h1>
        </div>

        <!-- Admin Dashboard Section (Hidden by default) -->
        <section id="admin-dashboard" class="hidden bg-[#111827] p-8 rounded-xl border border-amber-600/30 mt-8 shadow-xl">
            <h2 class="text-xl font-bold text-amber-400 mb-6">Admin Dashboard</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <tbody id="table-body" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </section>

        <!-- Footer with Hidden Admin Link -->
        <footer class="mt-20 py-8 text-center border-t border-gray-900 bg-[#070a12]">
            <p class="text-gray-600 text-sm">© 2026 Kingdom 1269 Alliance.</p>
            <p class="text-amber-500 font-bold mt-2 tracking-widest">Designed by Hell🔥</p>
            
            <!-- رابط مخفي في الأسفل للوصول للداشبورد عبر فحص صلاحيات الفايربيس -->
            <div class="mt-4">
                <a href="javascript:void(0);" onclick="openAdminDashboard()" class="text-gray-700 hover:text-amber-500 text-[10px] uppercase tracking-widest transition">
                    Dashboard Access
                </a>
            </div>
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ضع إعدادات مشروعك هنا
        const firebaseConfig = {
            // apiKey, authDomain, projectId, etc.
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // الدالة المرتبطة بالرابط المخفي والتي تتحقق من صلاحيات الأدمن عبر Firebase
        window.openAdminDashboard = function() {
            const user = auth.currentUser;
            
            if (!user) {
                alert("Please sign in with your admin Google account first.");
                return;
            }

            // التحقق من صلاحيات الأدمن المسجلة في الـ Firebase (Claims أو عبر قاعدة البيانات)
            user.getIdTokenResult().then((idTokenResult) => {
                // إذا كان الأدمن معرف مسبقاً في الـ Custom Claims أو إيميلك الأساسي
                if (idTokenResult.claims.admin || user.email === "kdn1269@gmail.com") {
                    const dashboard = document.getElementById('admin-dashboard');
                    dashboard.classList.remove('hidden');
                    dashboard.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Access Denied: You do not have administrator privileges.");
                }
            }).catch((error) => {
                console.error("Error verifying admin status:", error);
                alert("Authentication check failed.");
            });
        };
    </script>
</body>
</html>
