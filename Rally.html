<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdom 1269 | Hell Rally Control</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #070a12;
      color: #f1f5f9;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .royal-card {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(10, 15, 28, 0.98));
      border: 1px solid rgba(245, 158, 11, 0.35);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070a12; }
    ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
  </style>
</head>
<body class="selection:bg-amber-500 selection:text-black">

  <!-- HEADER NAVBAR -->
  <header class="w-full bg-slate-950/90 border-b border-amber-500/30 px-6 py-4 flex items-center justify-between shadow-2xl backdrop-blur-md sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <img src="./images/IMG_3934.png" alt="Kingdom 1269" class="w-10 h-10 object-cover rounded-lg border border-amber-500 shadow-md">
      <h1 class="font-cinzel text-lg md:text-xl font-bold gold-gradient-text">Kingdom 1269 | Hell Rally Control</h1>
    </div>
    <div class="flex items-center gap-3">
      <div id="userBadge" class="hidden text-xs text-amber-400 font-semibold bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
        <span id="userNameDisplay">Commander</span>
      </div>
      <a href="index.html" class="bg-slate-900 hover:bg-amber-600 text-amber-400 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition border border-amber-500/40 flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow space-y-8">
    
    <div class="text-center space-y-2">
      <h2 class="text-3xl md:text-4xl font-black font-cinzel gold-gradient-text">Simultaneous Rally Launcher</h2>
      <p class="text-xs text-slate-400 uppercase tracking-widest">Synchronize alliance rally marches with precise countdown timers and audio alerts.</p>
    </div>

    <!-- RALLY CONTROL PANEL -->
    <section class="royal-card p-6 md:p-8 rounded-2xl shadow-2xl space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-2">Target Name / Castle / Structure</label>
          <input type="text" id="targetNameInput" value="Castle 1 (X: 528 Y: 732)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-300 mb-2">Launch Countdown (Seconds)</label>
          <input type="number" id="countdownSeconds" value="30" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="text-center py-6 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-2">
        <span class="text-xs text-slate-400 uppercase tracking-widest font-mono">Sync Status Timer</span>
        <div id="timerDisplay" class="font-cinzel text-5xl md:text-6xl font-black text-amber-400 tracking-wider">00:30</div>
      </div>

      <div class="flex gap-4">
        <button onclick="startRallyCountdown()" class="flex-1 py-3.5 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-bold rounded-xl transition shadow-lg text-xs tracking-wider uppercase">
          Start Synchronized Countdown
        </button>
        <button onclick="resetRallyCountdown()" class="px-6 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition text-xs uppercase">
          Reset
        </button>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-6 text-xs font-bold text-amber-500/80 tracking-widest uppercase border-t border-amber-500/20 bg-slate-950/90 backdrop-blur-md mt-16">
      Design by Hell🔥
  </footer>

  <!-- FIREBASE & TIMER SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9WCd_D9kKxFb6xP4IcWK46itFWNOuU5g",
      authDomain: "kingdom-1269-portal.firebaseapp.com",
      projectId: "kingdom-1269-portal",
      storageBucket: "kingdom-1269-portal.firebasestorage.app",
      messagingSenderId: "1007373803222",
      appId: "1:1007373803222:web:bcb85595a99da596aaf377"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let countdownInterval = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (userSnap.exists()) {
          const data = userSnap.data();
          document.getElementById('userBadge').classList.remove('hidden');
          document.getElementById('userNameDisplay').textContent = `${data.nickname} (${data.alliance})`;
        }
      }
    });

    window.startRallyCountdown = function() {
      clearInterval(countdownInterval);
      let seconds = parseInt(document.getElementById('countdownSeconds').value) || 30;
      const display = document.getElementById('timerDisplay');

      countdownInterval = setInterval(() => {
        if (seconds <= 0) {
          clearInterval(countdownInterval);
          display.textContent = "LAUNCH!";
          playAlertSound();
        } else {
          let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
          let secs = (seconds % 60).toString().padStart(2, '0');
          display.textContent = `${mins}:${secs}`;
          seconds--;
        }
      }, 1000);
    };

    window.resetRallyCountdown = function() {
      clearInterval(countdownInterval);
      document.getElementById('timerDisplay').textContent = "00:30";
    };

    function playAlertSound() {
      try {
        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        audio.play();
      } catch (e) {
        console.warn("Audio play prevented.");
      }
    }
  </script>
</body>
</html>
